<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>鼎校教育九宫格循环记忆法</title>
<style>
:root{
  --teal:#26C2A6; --teal-d:#00ABAB;
  --green:#77BC41; --red:#DF644C; --orange:#ED9A24;
  --card:#FFFFFF; --ink:#2B3A3A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0e8c6d;color:var(--ink);user-select:none}

/* ---- 全屏原版底图 ---- */
#bg{position:fixed;inset:0;z-index:0;
  background:url("assets/dysNineBg.png") center/cover no-repeat, #4B9ECF}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.20) 100%)}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* ---- 顶部：原版标题图 + 进度 ---- */
header{padding:calc(env(safe-area-inset-top) + 8px) 12px 4px;text-align:center;flex:0 0 auto}
#titleImg{height:38px;max-width:82%;object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.28))}
#sub{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;
  color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
#sub b{font-weight:700}
#bar{height:6px;border-radius:6px;background:rgba(255,255,255,.32);overflow:hidden;margin:8px 22px 0}
#bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,#8BE29A,#4FD1A5);transition:width .3s}

/* ---- 九宫格 ---- */
main{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 12px}
#grid{width:100%;max-width:560px;display:grid;gap:10px;
  grid-template-columns:repeat(3,1fr)}

.card{position:relative;aspect-ratio:1/.82;background:var(--card);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 4px;box-shadow:0 3px 10px rgba(0,0,0,.18);
  transition:transform .12s,opacity .3s,box-shadow .2s;cursor:pointer;overflow:hidden}
.card:active{transform:scale(.95)}
.card .w{font-size:clamp(13px,3.7vw,18px);font-weight:700;line-height:1.1;
  word-break:break-word;text-align:center;padding:0 2px;color:#20403A}
.card .p{font-size:clamp(9px,2.3vw,11px);color:#6a8380;margin-top:4px;
  max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 状态圆点（原版 word_nine_*.png） */
.dot{position:absolute;top:5px;right:5px;width:16px;height:16px;
  background-size:contain;background-repeat:no-repeat}
.card.todo .dot{background-image:url("assets/word_nine_orange.png")}
.card.done .dot{background-image:url("assets/word_nine_green.png")}
.card.miss .dot{background-image:url("assets/word_nine_red.png")}

/* 已掌握：永久划掉（变暗+斜线图标） */
.card.done{background:#E9F6E5;opacity:.72}
.card.done .w{color:#5b8a54;text-decoration:line-through;text-decoration-thickness:2px}
.card.done::after{content:"";position:absolute;inset:0;
  background:url("assets/icon_word_cut.png") center/38% no-repeat;opacity:.5;pointer-events:none}
.card.miss{background:#FCEBE6}
.card.miss::after{content:"";position:absolute;inset:0;
  background:url("assets/icon_word_no.png") center/34% no-repeat;opacity:.45;pointer-events:none}

/* 翻卡动画 */
.card.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.card.gone{opacity:0;transform:scale(.6);pointer-events:none}

/* ---- 底部工具栏（原版 btn_yes/btn_no/audio） ---- */
footer{flex:0 0 auto;padding:6px 14px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;align-items:center;justify-content:center;gap:14px}
.fbtn{border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:11px;color:#fff;font-weight:600;
  text-shadow:0 1px 2px rgba(0,0,0,.4);cursor:pointer}
.fbtn img{width:52px;height:52px;object-fit:contain;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.fbtn:active img{transform:scale(.92)}
.fbtn.big img{width:62px;height:62px}

/* ---- 弹层 ---- */
.overlay{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;background:rgba(0,0,0,.45);
  padding:24px;text-align:center;color:#fff}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:#fff;color:#20403A;border-radius:20px;padding:22px 20px;
  width:100%;max-width:340px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.panel h2{margin:0 0 6px;font-size:20px;color:var(--teal-d)}
.panel p{margin:6px 0;font-size:14px;color:#557}
.panel .big{font-size:34px;font-weight:800;color:var(--green);margin:6px 0}
.panel button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;
  font-size:15px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#2ED0B0,#00ABAB)}
.panel button.ghost{background:#E8F1F0;color:#356;margin-top:8px}
.panel .row{display:flex;gap:10px}

/* 设置项 */
.set{display:flex;align-items:center;justify-content:space-between;
  padding:10px 2px;border-bottom:1px solid #eef2f2;font-size:14px}
.set:last-child{border-bottom:0}
.set select,.set input[type=range]{accent-color:var(--teal)}
.set select{padding:6px 8px;border-radius:8px;border:1px solid #cfe;background:#f7fffd;font-size:13px}
.set .minibtn{margin:0 0 0 8px;padding:7px 12px;border-radius:9px;border:1px solid #cfe2df;background:#f2fbf9;color:#177;font-size:13px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<div id="app">
  <header>
    <img id="titleImg" src="assets/dys_title.png" alt="鼎校教育九宫格循环记忆法">
    <div id="sub">
      <span>第 <b id="lvNo">-</b> 关</span>
      <span>剩余 <b id="left">0</b></span>
      <span>本轮 <b id="round">0</b></span> <span id='ver' style='opacity:.55;font-size:11px'>v4</span>
    </div>
    <div id="bar"><i></i></div>
  </header>

  <main><div id="grid"></div></main>

  <footer>
    <button class="fbtn big" id="bRead"><img src="assets/audio.png" alt=""><span>朗读</span></button>
    <button class="fbtn big" id="bMiss"><img src="assets/btn_no.png" alt=""><span>不会</span></button>
    <button class="fbtn big" id="bKnow"><img src="assets/btn_yes.png" alt=""><span>会了</span></button>
    <button class="fbtn" id="bSet"><img src="assets/word_nine_back.png" alt="" style="width:34px;height:34px"><span>设置</span></button>
  </footer>
</div>

<!-- 通关 -->
<div class="overlay" id="ovDone">
  <div class="panel">
    <h2>🎉 本关通关</h2>
    <div class="big" id="doneCount">0</div>
    <p>全部单词已掌握</p>
    <button id="nextLv">进入下一关</button>
    <button class="ghost" id="againLv">再复习一遍</button>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="ovSet">
  <div class="panel" style="text-align:left">
    <h2 style="text-align:center">⚙ 设置</h2>
    <div class="set"><span>朗读语速</span><input type="range" id="rate" min="0.5" max="1.2" step="0.02" value="0.82"></div>
    <div class="set"><span>自动朗读</span><input type="range" id="autoRead" min="0" max="2" step="1" value="1" style="width:90px"></div>
    <div class="set"><span>每日新增上限</span><select id="dailyNew"><option>5</option><option>10</option><option>15</option><option>20</option></select></div>
    <div class="set"><span>格数</span><select id="gridCnt"><option value="9">九宫格(3×3)</option><option value="5">五宫格(5词)</option><option value="6">六格(3×2)</option></select></div>
        <div class='set'><span>词库</span><span id='impName' style='font-size:12px;color:#557'>内置</span></div>
    <div class='set'><span>导入单词</span><span><button class='minibtn' id='impBtn'>选择文件</button> <button class='minibtn' id='impReset' style='margin-left:6px'>恢复内置</button></span></div>
    <input type='file' id='impFile' accept='.json,.csv,.txt,application/json,text/plain' style='display:none'>
<button id="setOk">完成</button>
    <button class="ghost" id="resetAll">清空进度（重新开始）</button>
  </div>
</div>

<script>
/* ============================================================
   鼎校教育 · 九宫格循环记忆法（网页复刻版）
   机制：卡片平铺 → 会的点掉永久划掉 → 不会的滚回队尾循环 →
        全清空通关 → 进度存本地 → 次日按记忆曲线出新复习词
   ============================================================ */
window.onerror=function(m,x,l){try{var d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#b00020;color:#fff;font:12px/1.4 sans-serif;padding:6px 8px;border-radius:8px;white-space:pre-wrap';document.body.appendChild(d);}d.textContent=String(m)+' @行'+l;}catch(_){}};

const KEY = 'dys_nine_progress_v1';

let cfg = { rate:0.82, autoRead:1, gridCnt:9, dailyCap:15 };
let st = {                              // 持久化状态
  lv: 0,                                // 当前关索引
  known: {},                            // w -> 掌握时间戳
  queue: [],                            // 本轮待清队列（单词对象）
  done: 0, round: 1
};
let voice = null, audioUnlocked = false, curIdx = 0;

/* ---------- 工具 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({cfg,st})); }catch(e){} }
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){ Object.assign(cfg,o.cfg||{}); Object.assign(st,o.st||{}); }
  }catch(e){}
}

/* ---------- 发音 ---------- */
function pickVoice(){
  if(!window.speechSynthesis) return;
  const vs = window.speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /female|zira|samantha|google us/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang))
       || vs.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text){
  if(!text) return;
  try{ if(window.AndroidTTS && typeof AndroidTTS.speak === 'function'){ AndroidTTS.speak(String(text)); return; } }catch(e){}
  if(!('speechSynthesis' in window)){
    try{
      if(!window._yau) window._yau=new Audio();
      window._yau.src='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=2';
      window._yau.play().catch(function(){});
    }catch(e){}
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = cfg.rate; u.pitch = 1;
    if(voice) u.voice = voice;
    u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 音效（解包原始 mp3） */
const SFX = { cut:new Audio('assets/audio/cut.mp3'), yes:new Audio('assets/audio/yes.mp3'),
              no:new Audio('assets/audio/no.mp3'), great:new Audio('assets/audio/great.mp3'),
              good:new Audio('assets/audio/good.mp3') };
function sfx(name){ try{ const a=SFX[name]; if(!a)return; a.currentTime=0; a.volume=.9;
  const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }

function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked = true;
  ['cut','yes','no','great','good'].forEach(n=>{ try{ SFX[n].play().then(()=>{SFX[n].pause();SFX[n].currentTime=0}).catch(()=>{});}catch(e){} });
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(' '); speechSynthesis.speak(u); }catch(e){}
  pickVoice();
}

/* ---------- 渲染 ---------- */
function level(){ return DATA[st.lv] || {level:'-',words:[]}; }
function remainList(){ return st.queue.filter(o=>!st.known[o.w]); }

function render(){
  const lv = level();
  const n = cfg.gridCnt;
  const all = remainList();
  const list = all.slice(0, n);
  const total = lv.words.length;

  $('#lvNo').textContent  = lv.level;
  $('#left').textContent  = all.length;
  $('#round').textContent = st.round;
  $('#bar>i').style.width = (total? Math.round((total-all.length)/total*100):0) + '%';

  const g = $('#grid');
  g.style.gridTemplateColumns = 'repeat(' + (n===5?3:3) + ',1fr)';
  g.innerHTML = '';

  list.forEach((o,i)=>{
    const c = document.createElement('div');
    c.className = 'card todo';
    c.innerHTML = '<span class="dot"></span>'
      + '<span class="w">' + esc(o.w) + '</span>'
      + '<span class="p">' + esc(o.p||'') + '</span>';
    c.addEventListener('click', ()=>{ curIdx = i; unlockAudio(); speak(o.w); });
    g.appendChild(c);
  });

  if(!all.length){ finishLevel(); return; }
  /* 自动朗读当前词 */
  if(cfg.autoRead>=1 && list.length){ setTimeout(()=>speak(list[0].w), 240); }
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ---------- 核心：会了 → 永久划掉 ---------- */
function markKnown(o, el){
  unlockAudio();
  if(st.known[o.w]) return;
  st.known[o.w] = Date.now();
  st.done++;
  sfx('cut');
  if(el){ el.classList.remove('todo'); el.classList.add('done','pop');
    setTimeout(()=>el.classList.add('gone'), 380); }
  setTimeout(()=>{ save(); const l=remainList();
    if(!l.length){ render(); } else { render(); } }, 420);
}

/* ---------- 核心：不会 → 滚回队尾 ---------- */
function markMiss(o){
  unlockAudio();
  const i = st.queue.indexOf(o);
  if(i>=0){ st.queue.splice(i,1); st.queue.push(o); }   // 移到队尾，继续循环
  st.round++;
  sfx('no');
  save(); render();
}

/* ---------- 通关 ---------- */
function finishLevel(){
  sfx('great');
  $('#doneCount').textContent = level().words.length;
  $('#ovDone').classList.add('show');
}

/* ---------- 底部按钮 ---------- */
$('#bKnow').onclick = ()=>{ const l=remainList(); if(l[0]) markKnown(l[0], $$('.card')[0]); };
$('#bMiss').onclick = ()=>{ const l=remainList(); if(l[0]) markMiss(l[0]); };
$('#bRead').onclick = ()=>{ unlockAudio(); const l=remainList(); if(l[0]) speak(l[0].w); };
$('#bSet').onclick  = ()=>{ unlockAudio(); $('#ovSet').classList.add('show'); };

/* ---------- 通关弹层 ---------- */
$('#nextLv').onclick = ()=>{ $('#ovDone').classList.remove('show');
  if(st.lv < DATA.length-1){ st.lv++; st.round=1; st.done=0; buildQueue(); save(); render(); }
  else alert('已是最后一关，去复(yu)习吧~'); };
$('#againLv').onclick = ()=>{ $('#ovDone').classList.remove('show');
  level().words.forEach(o=>delete st.known[o.w]); st.round=1; st.done=0; buildQueue(); save(); render(); };

/* ---------- 设置 ---------- */
$('#setOk').onclick = ()=>{
  cfg.rate = parseFloat($('#rate').value);
  cfg.autoRead = parseInt($('#autoRead').value,10);
  cfg.gridCnt = parseInt($('#gridCnt').value,10);
  cfg.dailyCap = parseInt($('#dailyNew').value,10);
  $('#ovSet').classList.remove('show'); save(); render();
};
$('#resetAll').onclick = ()=>{ if(confirm('清空所有学习进度？')){
  localStorage.removeItem(KEY); st={lv:0,known:{},queue:[],done:0,round:1}; buildQueue(); save(); render(); } };
$('#rate').oninput = e => { cfg.rate = parseFloat(e.target.value); };

/* ---------- 队列构建 ---------- */
function buildQueue(){
  st.queue = (level().words||[]).filter(o=>!st.known[o.w]).map(o=>({...o}));
}

const KEYD='kk9_data_v1';
function setImpLabel(t){ try{ var el=document.getElementById('impName'); if(el) el.textContent=t||'内置'; }catch(e){} }
function flatWords(j){
  var out=[];
  function push(o){
    if(o===null||o===undefined) return;
    if(typeof o==='string'){ var s0=o.trim(); if(s0) out.push({w:s0,p:'',m:''}); return; }
    if(Object.prototype.toString.call(o)==='[object Array]'){
      if(o.length) out.push({w:String(o[0]||'').trim(), p:String(o[1]||'').trim(), m:String(o[2]||'').trim()});
      return;
    }
    if(typeof o==='object'){
      if(Object.prototype.toString.call(o.words)==='[object Array]'){ o.words.forEach(push); return; }
      var w0=o.w||o.word||o.en||o.english||'';
      if(String(w0).trim()) out.push({w:String(w0).trim(), p:String(o.p||o.phonetic||o.ipa||'').trim(), m:String(o.m||o.mean||o.meaning||o.cn||o.zh||'').trim()});
    }
  }
  if(Object.prototype.toString.call(j)==='[object Array]'){ for(var i=0;i<j.length;i++) push(j[i]); } else { push(j); }
  return out;
}
function lineWords(t){
  var out=[]; var lines=t.split(String.fromCharCode(10));
  for(var i=0;i<lines.length;i++){
    var line=lines[i].split(String.fromCharCode(13)).join('').trim();
    if(line.charCodeAt(0)===65279) line=line.slice(1).trim();
    if(!line) continue;
    var w='',rest='';
    var SEP=String.fromCharCode(9)+',;|';
    var cut=-1;
    for(var k=0;k<line.length;k++){ if(SEP.indexOf(line.charAt(k))>=0){ cut=k; break; } }
    if(cut<1){ for(var k2=0;k2<line.length;k2++){ if(line.charAt(k2)===' '){ cut=k2; break; } } }
    if(cut>0){
      var head=line.slice(0,cut); var ok=true;
      var CH='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'+String.fromCharCode(39)+'-';
      for(var k3=0;k3<head.length;k3++){ if(CH.indexOf(head.charAt(k3))<0){ ok=false; break; } }
      if(ok){ w=head; rest=line.slice(cut+1).trim(); }
    }
    if(!w){ w=line; rest=''; }
    var p='', m=rest;
    if(m.charAt(0)==='['){ var e1=m.indexOf(']'); if(e1>0){ p=m.slice(0,e1+1); m=m.slice(e1+1).trim(); } }
    else if(m.charAt(0)==='/'){ var e2=m.indexOf('/',1); if(e2>0){ p='['+m.slice(1,e2)+']'; m=m.slice(e2+1).trim(); } }
    out.push({w:w,p:p,m:m});
  }
  return out;
}
function doImport(text,fname){
  var t=String(text||'').trim();
  if(t.charCodeAt(0)===65279) t=t.slice(1).trim();
  var words=[];
  var c0=t.charAt(0);
  if(c0==='['||c0==='{'){ words=flatWords(JSON.parse(t)); } else { words=lineWords(t); }
  var f=[]; for(var i2=0;i2<words.length;i2++){ if(words[i2].w) f.push(words[i2]); }
  if(!f.length) throw new Error('没有解析到单词');
  var LV=15; var data=[];
  for(var i3=0;i3<f.length;i3+=LV){ data.push({level:Math.floor(i3/LV)+1, words:f.slice(i3,i3+LV)}); }
  DATA=data;
  localStorage.setItem(KEYD, JSON.stringify(data));
  cfg.impName=fname? (fname+' · '+f.length+' 词') : (f.length+' 词');
  st={lv:0,known:{},queue:[],done:0,round:1};
  buildQueue(); save(); render(); setImpLabel(cfg.impName);
  alert('导入成功：共 '+f.length+' 个单词，已分为 '+data.length+' 组（每组15词）');
}
var _ib=document.getElementById('impBtn'); var _ir=document.getElementById('impReset'); var _if=document.getElementById('impFile');
if(_ib&&_if) _ib.onclick=function(){ _if.click(); };
if(_if) _if.onchange=function(e){
  var f0=e.target.files&&e.target.files[0]; if(!f0) return;
  var rd=new FileReader();
  rd.onload=function(){ try{ doImport(String(rd.result), f0.name); }catch(err){ alert('导入失败：'+err.message); } };
  rd.readAsText(f0,'utf-8'); e.target.value='';
};
if(_ir) _ir.onclick=function(){ if(confirm('恢复内置词库？导入的单词和进度将被清除。')){ localStorage.removeItem(KEYD); localStorage.removeItem(KEY); location.reload(); } };
function boot(){
  load();
  try{ var _imp=JSON.parse(localStorage.getItem(KEYD)||'null'); if(_imp && _imp.length){ DATA=_imp; } dataImpVar=1; }catch(e){}
  if(cfg.impName) setImpLabel(cfg.impName);
  pickVoice();
  if(!st.queue || !st.queue.length) buildQueue();
  $('#rate').value = cfg.rate;
  $('#autoRead').value = cfg.autoRead;
  $('#gridCnt').value = cfg.gridCnt;
  $('#dailyNew').value = cfg.dailyCap;
  if(!DATA || !DATA.length){ $('#grid').innerHTML = '<p style="color:#fff">词表为空</p>'; return; }
  render();
  /* 首次交互解锁音频（浏览器硬要求） */
  ['click','touchstart','keydown'].forEach(ev=>
    window.addEventListener(ev, unlockAudio, {once:true, passive:true}));
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;
try{ boot(); }catch(e){ window.onerror&&window.onerror(e&&e.message||String(e),0,0); }
</script>
