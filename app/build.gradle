plugins {
    id 'com.android.application'
}
android {
    namespace 'com.dingxiao.jiugongge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dingxiao.jiugongge'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName 'v8.2'
    }
    signingConfigs {
        fix {
            storeFile file('../fix.keystore')
            storePassword 'jiugongge2026'
            keyAlias 'jiugongge'
            keyPassword 'jiugongge2026'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fix
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fix
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
